<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ HTTP Server</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 C++ HTTP Web Server</h1>

        <p class="subtitle">
            Congratulations! Your C++ web server is successfully serving static files.
        </p>

        <div class="status-card">
            <h2>Server Status</h2>

            <ul>
                <li>✅ Winsock Initialized</li>
                <li>✅ TCP Socket Created</li>
                <li>✅ HTTP Request Parsed</li>
                <li>✅ Router Working</li>
                <li>✅ HTML Served</li>
                <li>✅ CSS Loaded</li>
                <li>✅ JavaScript Loaded</li>
            </ul>
        </div>

        <button onclick="showMessage()">
            Test JavaScript
        </button>

        <p id="message"></p>

    </div>

    <script src="/script.js"></script>

</body>
</html>
